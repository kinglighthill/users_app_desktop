plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.10'
//    id 'org.jetbrains.kotlin.jvm' version '1.6.0-RC'
//    id 'org.sqlite'
}

group 'com.scholarly.utme'
version '1.0-SNAPSHOT'



repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.8.0'
}

sourceCompatibility = "16"
targetCompatibility = "16"

//sourceSets {
//    create("intTest") {
//        compileClasspath += sourceSets.main.get().output
//        runtimeClasspath += sourceSets.main.get().output
//    }
//}
//
//val intTestImplementation by configurations.getting {
//    extendsFrom(configurations.implementation.get())
//}
//
//configurations["intTestRuntimeOnly"].extendsFrom(configurations.runtimeOnly.get())
//
//tasks.register("intTestJar", Jar.class) {
//    from(sourceSets["intTest"].output)
//}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

application {
    mainModule = 'com.scholarly.utme'
    mainClass = 'com.scholarly.utme.HelloApplication'
}

javafx {
    version = '15.0.1'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web']
}

dependencies {
    implementation('org.controlsfx:controlsfx:11.1.0') {
        exclude group: 'org.openjfx'
    }
    implementation('com.dlsc.formsfx:formsfx-core:11.4.2') {
        exclude group: 'org.openjfx'
    }
    implementation('net.synedra:validatorfx:0.1.13') {
        exclude(group: 'org.openjfx')
    }
    implementation('org.kordamp.ikonli:ikonli-javafx:12.2.0') {
        exclude group: 'org.openjfx'
    }
    implementation('org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0') {
        exclude group: 'org.openjfx'
    }
    /*implementation('eu.hansolo:tilesfx:16.0.3') {
        exclude group: 'org.openjfx'
    }*/

    /*implementation('org.xerial:sqlite-jdbc:3.36.0.2') {
        exclude group: 'org.sqlite'
    }*/
    implementation 'io.github.willena:sqlite-jdbc:3.35.5.3'

    implementation "io.reactivex.rxjava3:rxjava:3.1.1"
    implementation "org.pdfsam.rxjava3:rxjavafx:3.0.2"

    // mvvmfx
    implementation 'de.saxsys:mvvmfx:1.8.0'

    implementation 'net.sf.sociaal:freetts:1.2.2'

    // Gson
    implementation 'com.google.code.gson:gson:2.8.9'

    // SQL connector
   // implementation 'org.xerial:sqlite-jdbc:3.36.0.1'


    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"


}

test {
    useJUnitPlatform()
}

