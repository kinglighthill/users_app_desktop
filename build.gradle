plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'//    id 'org.jetbrains.kotlin.jvm' version '1.6.0-RC'
    id 'org.beryx.jlink' version '2.25.0'
//    id 'org.sqlite'
}

group 'com.scholarly.utme'
version '1.0-SNAPSHOT'



repositories {
    mavenCentral()
    google()

    maven {
        url "https://sandec.jfrog.io/artifactory/repo"
    }
}

ext {
    junitVersion = '5.9.2'
}

sourceCompatibility = '16'
targetCompatibility = '16'

project.ext.buildDate = new Date()
project.version = "0.4"

application {
    mainModule = 'com.scholarly.utme'
    mainClass = 'com.scholarly.utme.MainApplication'
}

javafx {
    version = '18.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.graphics']
}

mainClassName = "$moduleName/com.scholarly.utme.MainApplication"

run {
    jvmArgs = ['-Djdk.gtk.version=2']
}

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'Scholarly Jamb CBT'
        jvmArgs = ['-Djdk.gtk.version=2']
    }

    jpackage {
        appVersion = '1.0.0'
        installerOptions = [
                '--description', "Scholarly Jamb CBT App",
                '--copyright', 'Copyrigth 2020-2024 Scholarly Educational Software Ltd'
        ]

        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        def imgType = currentOs.windows ? 'ico' : currentOs.macOsX ? 'icns' : 'png'
        imageOptions += ['--icon', "src/main/resources/drawable/app_icon.$imgType"]
        installerOptions += ['--resource-dir', "src/main/resources"]
        installerOptions += ['--vendor', 'Scholarly Tech']

        if(currentOs.windows) {
            installerOptions += ['--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut']
        } else if (currentOs.linux) {
            installerOptions += ['--linux-package-name', 'scholarly','--linux-shortcut']
        } else if (currentOs.macOsX) {
            installerOptions += ['--mac-package-name', 'scholarly']
        }

        /*installerType = project.findProperty('installerType')
        if (installerType == 'msi') {
            imageOptions += ['--icon', 'src/main/resources/drawable/app_logo.png']
            installerOptions += [
                    '--win-per-user-install', '--win-dir-chooser',
                    '--win-menu', '--win-shortcut'
            ]
        }
