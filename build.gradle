                    '--linux-shortcut'
            ]
        }
        if (installerType == 'deb') {
            installerOptions += [
                    '--linux-deb-maintainer', 'office@walczak.it'
            ]
        }
        if (installerType == 'rpm') {
            installerOptions += [
                    '--linux-rpm-license-type', 'GPLv3'
            ]
        }*/
    }

    mergedModule {
        /*requires 'javafx.graphics';
        requires 'javafx.controls';
        requires 'java.logging';
        requires 'javafx.swing';
        requires 'java.sql';
        requires 'java.xml';
        requires 'java.desktop';
        requires 'java.datatransfer';
        requires 'java.security.jgss';
        requires 'javafx.base';
        requires 'javafx.fxml';
        requires 'jdk.unsupported';
        provides 'java.sql.Driver' with 'org.sqlite.JDBC';
        provides 'javax.imageio.spi.ImageInputStreamSpi' with 'com.twelvemonkeys.imageio.color.ProfileDeferralActivator.Spi',
                'com.twelvemonkeys.imageio.stream.BufferedFileImageInputStreamSpi',
                'com.twelvemonkeys.imageio.stream.BufferedInputStreamImageInputStreamSpi',
